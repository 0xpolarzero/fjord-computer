name: Test

# Every push to main runs the suite on the release runner, so a test that only fails there shows up before a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # Bounded: a test that hangs can't hold the runner (the slowest full run takes a few minutes).
      # A hang leaves no trace of what it was stuck on (the output stops where the last test finished), and a
      # timed-out step's processes are gone before any later step runs. So a watchdog in this step samples the
      # test process's threads at 17 minutes, which names the hung test, and then fails the run.
      - name: Test
        timeout-minutes: 20
        run: |
          ./scripts/test.sh &
          suite=$!
          for _ in $(seq 1020); do
            kill -0 "$suite" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$suite" 2>/dev/null; then
            echo "::error::The test run is still going after 17 minutes; sampling where it is stuck."
            for pid in $(pgrep -f swiftpm-testing || true); do
              echo "::group::sample $pid"
              sample "$pid" 5 -file /dev/stdout || true
              echo "::endgroup::"
            done
            exit 1
          fi
          wait "$suite"
