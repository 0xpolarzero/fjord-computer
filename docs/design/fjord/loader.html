<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fjord — mark as loader</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink: #101418; --paper: #F7F8F5; --fonte: #0F9AC3; --bg: var(--ink); --text: var(--paper); --sec: #A3AAB0; --line: #2A3138; }
  [data-theme="light"] { --bg: var(--paper); --text: var(--ink); --sec: #5C636A; --line: #DCDFD9; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 Geist, system-ui, sans-serif; padding: 40px; transition: background .3s, color .3s; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 32px; }
  h1 { font-weight: 500; font-size: 22px; letter-spacing: -.03em; }
  button { font: inherit; color: var(--text); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  table { border-collapse: collapse; }
  th { font: 12px "Geist Mono", monospace; color: var(--sec); font-weight: 400; text-align: left; padding: 0 28px 12px 0; }
  td { padding: 0 28px 28px 0; vertical-align: middle; }
  td.label { font: 12px "Geist Mono", monospace; color: var(--sec); white-space: nowrap; }
  canvas { display: block; }
  .row { display: flex; align-items: center; gap: 20px; }
  .inline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sec); border-top: 1px solid var(--line); padding-top: 24px; margin-top: 8px; }
</style>
</head>
<body>
<header><h1>The mark as a loader</h1><button id="theme">light</button></header>
<table id="t"></table>
<div class="inline"><canvas data-mark="five" data-anim="swell" data-size="16"></canvas> Syncing 14 repositories… <span style="margin-left:28px"></span><canvas data-mark="fjord" data-anim="swell" data-size="16"></canvas> Syncing 14 repositories…</div>
<script>
const MARKS = {
  fjord: ['.......', '##...##', '.#...#.', '.#~~~#.', '..~~~..', '...~...', '.......'],
  five: ['.....', '#...#', '#~~~#', '.~~~.', '..~..'],
};
const ease = (t) => 1 - Math.pow(1 - t, 3);                       // the studio's settle: fast out, no overshoot
const clamp = (v) => Math.max(0, Math.min(1, v));
// each animation: (kind, row, col, rows, cols, time, waterRows) -> scale of the dot (1 = its resting size)
const ANIMS = {
  // the water fills the trough from the floor up, holds, then drains
  rise(kind, r, c, R, C, t, W) {
    if (kind !== '~') return 1;
    const i = W.indexOf(r), n = W.length, p = (t / 2.6) % 1;   // 2.6 s cycle
    const from = (n - 1 - i) / n * 0.4, to = 0.55 + i / n * 0.3;
    if (p < from) return 0;
    if (p < from + 0.12) return ease((p - from) / 0.12);
    if (p < to) return 1;
    return 1 - ease(clamp((p - to) / 0.12));
  },
  // a slow swell travels down through the depth, row by row
  tide(kind, r, c, R, C, t, W) {
    if (kind !== '~') return 1;
    const i = W.indexOf(r), w = Math.sin((t / 1.8 - i / W.length) * Math.PI * 2);
    return 0.62 + 0.38 * (0.5 + 0.5 * w);
  },
  // the tide: a water level that rises a little above the surface and ebbs into the depth, undulating sideways.
  // Grid dots swell as the surface passes through them (the scan); water dots are full while submerged and shrink
  // when the ebb leaves them in the air; the rock stays put.
  swell(kind, r, c, R, C, t, W) {
    const top = W[0], bottom = W[W.length - 1];
    const tide = Math.sin(t / 3.2 * Math.PI * 2);                       // a slow rise and fall, 3.2 s
    const ripple = 0.28 * Math.sin((t / 1.6 - c / C) * Math.PI * 2);     // the surface travels sideways
    const level = top + 0.15 + (bottom - top) * 0.45 * (0.5 - 0.5 * tide) - 0.9 * Math.max(0, tide) + ripple;
    const dist = Math.abs(r - level), band = Math.max(0, 1 - dist / 1.1);
    if (kind === '.') return 1 + 2.4 * band * band;
    if (kind === '~') return r + 0.5 >= level ? 1 - 0.12 * band : Math.max(0.18, 1 - (level - r - 0.5) * 1.4);
    return 1;
  },
  // a wave of size runs diagonally across the whole grid; the fjord stays lit
  scan(kind, r, c, R, C, t) {
    const pos = ((t / 1.6) % 1) * (R + C + 4) - 2, dist = Math.abs(r + c - pos);
    const bump = Math.max(0, 1 - dist / 1.6);
    return kind === '.' ? 1 + 2.6 * bump * bump : 1 + 0.18 * bump;
  },
};
function mount(canvas) {
  const mark = MARKS[canvas.dataset.mark], anim = ANIMS[canvas.dataset.anim], size = +canvas.dataset.size;
  const grid = canvas.dataset.grid !== 'no';
  const dpr = devicePixelRatio || 1; canvas.width = canvas.height = size * dpr; canvas.style.width = canvas.style.height = size + 'px';
  const g = canvas.getContext('2d'), R = mark.length, C = mark[0].length;
  const W = [...new Set(mark.flatMap((row, r) => row.includes('~') ? [r] : []))];
  function frame(now) {
    const t = now / 1000, css = getComputedStyle(document.body);
    const rock = css.getPropertyValue('--text').trim(), fonte = css.getPropertyValue('--fonte').trim();
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, size, size);
    const cell = size / R;
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const kind = mark[r][c];
      if (kind === '.' && !grid) continue;
      const base = kind === '.' ? 0.085 : 0.32, s = anim(kind, r, c, R, C, t, W);
      const rad = cell * base * s;
      if (rad <= 0.05) continue;
      g.fillStyle = kind === '~' ? fonte : rock;
      g.globalAlpha = kind === '.' ? Math.min(1, 0.55 + 0.45 * (s - 1)) : 1;
      g.beginPath(); g.arc((c + 0.5) * cell, (r + 0.5) * cell, rad, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
const t = document.getElementById('t'), sizes = [128, 64, 32, 24, 16];
t.innerHTML = '<tr><th></th>' + sizes.map((s) => `<th>${s} px</th>`).join('') + '<th>no grid, 64</th></tr>' +
  ['fjord', 'five'].flatMap((m) => ['tide', 'swell', 'scan'].map((a) =>
    `<tr><td class="label">${m} · ${a}</td>` + sizes.map((s) => `<td><canvas data-mark="${m}" data-anim="${a}" data-size="${s}"></canvas></td>`).join('') +
    `<td><canvas data-mark="${m}" data-anim="${a}" data-size="64" data-grid="no"></canvas></td></tr>`)).join('');
document.querySelectorAll('canvas').forEach(mount);
const btn = document.getElementById('theme');
btn.onclick = () => { const light = document.documentElement.dataset.theme !== 'light'; document.documentElement.dataset.theme = light ? 'light' : 'dark'; btn.textContent = light ? 'dark' : 'light'; };
</script>
</body>
</html>
